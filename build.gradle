plugins {
	id "se.bjurr.gradle.bundle-command-shadow" version "2.4.0"
}

dependencies {
	implementation 'se.bjurr.violations:violation-comments-to-gitlab-lib:2.0.0'
	implementation "se.bjurr.violations:violations-lib:3.0.0"
	implementation 'info.picocli:picocli:4.7.7'
	implementation "org.slf4j:slf4j-simple:2.0.19"
}

shadowExtension {
	mainClass.set("se.bjurr.violations.main.Main")
	relocate.set("org:org,com:com")
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}

javaExtension {
	javaVersion = 17
}



